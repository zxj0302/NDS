# =============================================================================
# Competitor Templates (DRY - Define Once, Use Everywhere)
# =============================================================================
competitor_templates: &competitor_templates
  neg_dsd: &neg_dsd
    toggle: false
    name: NEG_DSD
    exe: ./build/neg_dsd
    params:
      C_values: [0.9, 1.0, 1.1, 1.2]
      num_iter: 1
  
  dcs_greedy: &dcs_greedy
    toggle: false
    name: DCSGreedy
    exe: ./build/dcs_greedy
    params:
      num_iter: 1
  
  cep: &cep
    toggle: false
    name: CEP
    exe: ./build/cep
    params: &cep_params
      toggle_done: 2
      toggle_left: 20
      max_neg: 200
      max_local_optima: 10
      do_peeling: false
      num_iter: 1

  miqcp: &miqcp
    toggle: false
    name: MIQCP
    exe: ./build/miqcp
    params:
      time_limit: 600.0
      mip_gap: 0.0001
      threads: 0
      verbose: false
      num_iter: 1

  cep_mip: &cep_mip
    toggle: false
    name: CEP_MIP
    exe: ./build/exact
    params: &cep_mip_params
      <<: *cep_params
      dinkelbach_iterations: 50
      epsilon: 0.9999
      mip_time_limit: 600.0
      enable_cep_init: true
      enable_binary_search: false
      enable_qpbo: false
      enable_qpbo_probe: false
      enable_graph_pruning: false
      enable_pruning_set: false
      enable_cep_middle: false
      enable_cep_lambda: false
      enable_qpboi: false
      enable_mip_init: false
      enable_mip_constrains_vertex_lb: false
      enable_mip_constrains_vertex_ub: false
      enable_cep_final: false
      
  cep_qpbo_mip: &cep_qpbo_mip
    toggle: false
    name: CEP_QPBO_MIP
    exe: ./build/exact
    params: &cep_qpbo_mip_params
      <<: *cep_mip_params
      step_size: 1.1
      direct_mip_bound: 100
      enable_binary_search: true
      enable_qpbo: true
      enable_qpbo_probe: false
      
  cep_pruning_qpbo_mip: &cep_pruning_qpbo_mip
    toggle: false
    name: CEP_PRUNING_QPBO_MIP
    exe: ./build/exact
    params: &cep_pruning_qpbo_mip_params
      <<: *cep_qpbo_mip_params
      enable_graph_pruning: true
      enable_pruning_set: false

  cep_pruning_qpbo_mip_constrain: &cep_pruning_qpbo_mip_constrain
    toggle: false
    name: CEP_PRUNING_QPBO_MIP_CONSTRAIN
    exe: ./build/exact
    params: &cep_pruning_qpbo_mip_constrain_params
      <<: *cep_pruning_qpbo_mip_params
      enable_mip_constrains_vertex_lb: true
      enable_mip_constrains_vertex_ub: true

  cep_pruning_qpbo_mip_constrain_cep: &cep_pruning_qpbo_mip_constrain_cep
    toggle: false
    name: CEP_PRUNING_QPBO_MIP_CONSTRAIN_CEP
    exe: ./build/exact
    params: &cep_pruning_qpbo_mip_constrain_cep_params
      <<: *cep_pruning_qpbo_mip_constrain_params
      enable_cep_final: true

  cep_pruning_qpbo_cep_mip: &cep_pruning_qpbo_cep_mip
    toggle: false
    name: CEP_PRUNING_QPBO_CEP_MIP
    exe: ./build/exact
    params: &cep_pruning_qpbo_cep_mip_params
      <<: *cep_pruning_qpbo_mip_params
      enable_cep_middle: true

  cep_pruning_qpbo_cep_mip_constrain: &cep_pruning_qpbo_cep_mip_constrain
    toggle: false
    name: CEP_PRUNING_QPBO_CEP_MIP_CONSTRAIN
    exe: ./build/exact
    params: &cep_pruning_qpbo_cep_mip_constrain_params
      <<: *cep_pruning_qpbo_cep_mip_params
      enable_mip_constrains_vertex_lb: true
      enable_mip_constrains_vertex_ub: true

  cep_pruning_qpbo_cep_mip_constrain_cep: &cep_pruning_qpbo_cep_mip_constrain_cep
    toggle: false
    name: CEP_PRUNING_QPBO_CEP_MIP_CONSTRAIN_CEP
    exe: ./build/exact
    params: &cep_pruning_qpbo_cep_mip_constrain_cep_params
      <<: *cep_pruning_qpbo_cep_mip_constrain_params
      enable_cep_final: true

  cep_pruning_qpbo_cep_init_mip_constrain_cep: &cep_pruning_qpbo_cep_init_mip_constrain_cep
    toggle: false
    name: CEP_PRUNING_QPBO_CEP_INIT_MIP_CONSTRAIN_CEP
    exe: ./build/exact
    params: &cep_pruning_qpbo_cep_init_mip_constrain_cep_params
      <<: *cep_pruning_qpbo_cep_mip_constrain_cep_params
      enable_cep_lambda: true
      enable_qpboi: false
      enable_mip_init: true

# =============================================================================
# Extended Competitor Templates with Epsilon Variations
# =============================================================================
competitor_templates_epsilon: &competitor_templates_epsilon
  <<: *competitor_templates
  
  cep_pruning_qpbo_mip_constrain_eps_90:
    toggle: false
    name: CEP_PRUNING_QPBO_MIP_CONSTRAIN_EPS_90
    exe: ./build/exact
    params:
      <<: *cep_pruning_qpbo_mip_constrain_params
      epsilon: 0.9
  
  cep_pruning_qpbo_mip_constrain_eps_95:
    toggle: false
    name: CEP_PRUNING_QPBO_MIP_CONSTRAIN_EPS_95
    exe: ./build/exact
    params:
      <<: *cep_pruning_qpbo_mip_constrain_params
      epsilon: 0.95
  
  cep_pruning_qpbo_mip_constrain_eps_99:
    toggle: false
    name: CEP_PRUNING_QPBO_MIP_CONSTRAIN_EPS_99
    exe: ./build/exact
    params:
      <<: *cep_pruning_qpbo_mip_constrain_params
      epsilon: 0.99
  
  cep_pruning_qpbo_mip_constrain_eps_999:
    toggle: false
    name: CEP_PRUNING_QPBO_MIP_CONSTRAIN_EPS_999
    exe: ./build/exact
    params:
      <<: *cep_pruning_qpbo_mip_constrain_params
      epsilon: 0.999

# =============================================================================
# Extended Competitor Templates with Non-Binary Logic
# =============================================================================
competitor_templates_nb: &competitor_templates_nb
  <<: *competitor_templates
  
  cep_pruning_qpbo_mip_constrain_nb:
    toggle: true
    name: CEP_PRUNING_QPBO_MIP_CONSTRAIN_NB
    exe: ./build/exact
    params:
      <<: *cep_pruning_qpbo_mip_constrain_params
      enable_binary_search: false
  
  cep_pruning_qpbo_mip_constrain_cep_nb:
    toggle: true
    name: CEP_PRUNING_QPBO_MIP_CONSTRAIN_CEP_NB
    exe: ./build/exact
    params:
      <<: *cep_pruning_qpbo_mip_constrain_cep_params
      enable_binary_search: false
  
  cep_pruning_qpbo_cep_mip_constrain_nb:
    toggle: true
    name: CEP_PRUNING_QPBO_CEP_MIP_CONSTRAIN_NB
    exe: ./build/exact
    params:
      <<: *cep_pruning_qpbo_cep_mip_constrain_params
      enable_binary_search: false
  
  cep_pruning_qpbo_cep_mip_constrain_cep_nb:
    toggle: false
    name: CEP_PRUNING_QPBO_CEP_MIP_CONSTRAIN_CEP_NB
    exe: ./build/exact
    params:
      <<: *cep_pruning_qpbo_cep_mip_constrain_cep_params
      enable_binary_search: false

# =============================================================================
# Final Competitors Selection
# =============================================================================
competitors: &competitors
  <<: *competitor_templates_nb

# =============================================================================
# Experiment Configurations
# =============================================================================

real-world:
  # Input datasets (individual files)
  input:
    - path: ./input/real-world/Abortion/Abortion.txt
      toggle: true
    - path: ./input/real-world/Biogrid/Biogrid.txt
      toggle: true
    - path: ./input/real-world/Brexit/Brexit.txt
      toggle: true
    - path: ./input/real-world/Collins/Collins.txt
      toggle: true
    - path: ./input/real-world/Election/Election.txt
      toggle: true
    - path: ./input/real-world/Gavin/Gavin.txt
      toggle: true
    - path: ./input/real-world/Gun/Gun.txt
      toggle: true
    - path: ./input/real-world/Krogan-Core/Krogan-Core.txt
      toggle: true
    - path: ./input/real-world/Krogan-Extended/Krogan-Extended.txt
      toggle: true
    - path: ./input/real-world/Partisanship/Partisanship.txt
      toggle: true
    - path: ./input/real-world/Referendum/Referendum.txt
      toggle: true
  
  weight_reverse: false
  output: ./output/real-world/
  
  # Use final competitors template
  competitors: *competitors

synthetic:
  # Input datasets (folders containing multiple files)
  input_folder:
    - path: ./input/synthetic/BA/
      toggle: false
    - path: ./input/synthetic/ER/
      toggle: true
    - path: ./input/synthetic/RGG/
      toggle: false
    - path: ./input/synthetic/SBM/
      toggle: false
    - path: ./input/synthetic/WS/
      toggle: false
  
  weight_reverse: false
  output: ./output/synthetic/
  competitors: *competitors

test:
  # Quick test configuration with minimal settings
  input:
    # - ./input/synthetic/BA/BA_n50000_m3_setting25_inst0.txt
    - ./input/synthetic/ER/ER_n100000_m500000_setting71_inst0.txt
    # - ./input/synthetic/WS/WS_n500000_k10_p0.3_setting172_inst0.txt
  
