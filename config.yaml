# =============================================================================
# Competitor Templates (DRY - Define Once, Use Everywhere)
# =============================================================================
competitor_templates: &competitor_templates
  neg_dsd:
    toggle: false
    name: NEG_DSD
    exe: ./build/neg_dsd
    params:
      C_values: [0.9, 1.0, 1.1, 1.2]
      run_time_limit: 3600.0
      num_iter: 1
  
  dcs_greedy:
    toggle: false
    name: DCSGreedy
    exe: ./build/dcs_greedy
    params:
      run_time_limit: 3600.0
      num_iter: 1
  
  cep:
    toggle: false
    name: CEP
    exe: ./build/cep
    params: &cep_params
      toggle_done: 2
      toggle_left: 20
      max_neg: 200
      max_local_optima: 10
      do_peeling: false
      run_time_limit: 3600.0
      num_iter: 1

  miqcp:
    toggle: false
    name: MIQCP
    exe: ./build/miqcp
    params:
      time_limit: 600.0
      run_time_limit: 3600.0
      mip_gap: 0.0001
      threads: 0
      verbose: false
      num_iter: 1

  cep_mip_b:
    toggle: false
    name: CEP_MIP_B
    exe: ./build/exact
    params: &cep_mip_b_params
      <<: *cep_params
      dinkelbach_iterations: 50
      epsilon: 0.9999
      mip_time_limit: 3600.0
      # Lower bound method: "cep", "neg_dsd", or "dcs_greedy"
      lb_method: "cep"
      # C_values for NEG_DSD lower bound method (only used if lb_method is "neg_dsd")
      lb_neg_dsd_c_values: [0.9, 1.0, 1.1, 1.2]
      enable_cep_init: true
      enable_binary_search: true
      enable_qpbo: false
      enable_qpbo_probe: false
      enable_graph_pruning: false
      enable_pruning_set: false
      enable_cep_middle: false
      enable_cep_lambda: false
      enable_qpboi: false
      enable_mip_init: false
      enable_mip_constrains_vertex_lb: false
      enable_mip_constrains_vertex_ub: false
      enable_cep_final: false

  # Competitor with Dinkelbach Logic
  cep_mip_d:
    toggle: false
    name: CEP_MIP_D
    exe: ./build/exact
    params:
      <<: *cep_mip_b_params
      enable_binary_search: false
      
  cep_qpbo_mip_b:
    toggle: false
    name: CEP_QPBO_MIP_B
    exe: ./build/exact
    params: &cep_qpbo_mip_b_params
      <<: *cep_mip_b_params
      step_size: 1.1
      direct_mip_bound: 100
      enable_qpbo: true
      enable_qpbo_probe: false

  cep_qpbo_mip_d:
    toggle: false
    name: CEP_QPBO_MIP_D
    exe: ./build/exact
    params:
      <<: *cep_qpbo_mip_b_params
      enable_binary_search: false
      
  cep_pruning_qpbo_mip_b:
    toggle: false
    name: CEP_PRUNING_QPBO_MIP_B
    exe: ./build/exact
    params: &cep_pruning_qpbo_mip_b_params
      <<: *cep_qpbo_mip_b_params
      enable_graph_pruning: true
      enable_pruning_set: false

  cep_pruning_qpbo_mip_d:
    toggle: false
    name: CEP_PRUNING_QPBO_MIP_D
    exe: ./build/exact
    params:
      <<: *cep_pruning_qpbo_mip_b_params
      enable_binary_search: false

  cep_pruning_qpbo_mip_constrain_b:
    toggle: false
    name: CEP_PRUNING_QPBO_MIP_CONSTRAIN_B
    exe: ./build/exact
    params: &cep_pruning_qpbo_mip_constrain_b_params
      <<: *cep_pruning_qpbo_mip_b_params
      enable_mip_constrains_vertex_lb: true
      enable_mip_constrains_vertex_ub: true

  cep_pruning_qpbo_mip_constrain_d:
    toggle: false
    name: CEP_PRUNING_QPBO_MIP_CONSTRAIN_D
    exe: ./build/exact
    params: &cep_pruning_qpbo_mip_constrain_d_params
      <<: *cep_pruning_qpbo_mip_constrain_b_params
      enable_binary_search: false

  cep_pruning_qpbo_mip_constrain_cep_b:
    toggle: false
    name: CEP_PRUNING_QPBO_MIP_CONSTRAIN_CEP_B
    exe: ./build/exact
    params: &cep_pruning_qpbo_mip_constrain_cep_b_params
      <<: *cep_pruning_qpbo_mip_constrain_b_params
      enable_cep_final: true

  cep_pruning_qpbo_mip_constrain_cep_d:
    toggle: false
    name: CEP_PRUNING_QPBO_MIP_CONSTRAIN_CEP_D
    exe: ./build/exact
    params:
      <<: *cep_pruning_qpbo_mip_constrain_cep_b_params
      enable_binary_search: false

  cep_pruning_qpbo_cep_mip_b:
    toggle: false
    name: CEP_PRUNING_QPBO_CEP_MIP_B
    exe: ./build/exact
    params: &cep_pruning_qpbo_cep_mip_b_params
      <<: *cep_pruning_qpbo_mip_b_params
      enable_cep_middle: true

  cep_pruning_qpbo_cep_mip_constrain_b:
    toggle: false
    name: CEP_PRUNING_QPBO_CEP_MIP_CONSTRAIN_B
    exe: ./build/exact
    params: &cep_pruning_qpbo_cep_mip_constrain_b_params
      <<: *cep_pruning_qpbo_cep_mip_b_params
      enable_mip_constrains_vertex_lb: true
      enable_mip_constrains_vertex_ub: true

  cep_pruning_qpbo_cep_mip_constrain_d:
    toggle: false
    name: CEP_PRUNING_QPBO_CEP_MIP_CONSTRAIN_D
    exe: ./build/exact
    params:
      <<: *cep_pruning_qpbo_cep_mip_constrain_b_params
      enable_binary_search: false

  cep_pruning_qpbo_cep_mip_constrain_cep_b:
    toggle: false
    name: CEP_PRUNING_QPBO_CEP_MIP_CONSTRAIN_CEP_B
    exe: ./build/exact
    params: &cep_pruning_qpbo_cep_mip_constrain_cep_b_params
      <<: *cep_pruning_qpbo_cep_mip_constrain_b_params
      enable_cep_final: true

  cep_pruning_qpbo_cep_mip_constrain_cep_d:
    toggle: false
    name: CEP_PRUNING_QPBO_CEP_MIP_CONSTRAIN_CEP_D
    exe: ./build/exact
    params:
      <<: *cep_pruning_qpbo_cep_mip_constrain_cep_b_params
      enable_binary_search: false

  cep_pruning_qpbo_cep_init_mip_constrain_cep_b:
    toggle: false
    name: CEP_PRUNING_QPBO_CEP_INIT_MIP_CONSTRAIN_CEP_B
    exe: ./build/exact
    params: &cep_pruning_qpbo_cep_init_mip_constrain_cep_b_params
      <<: *cep_pruning_qpbo_cep_mip_constrain_cep_b_params
      enable_cep_lambda: true
      enable_qpboi: false
      enable_mip_init: true

